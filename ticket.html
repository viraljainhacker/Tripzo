<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ticket - Tripzo</title>

    <link rel="stylesheet" href="Style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="ticket" id="ticketCard">
      <div class="ticket-header">
        <img src="logo.png" width="80" />
        <p>E-Ticket</p>
      </div>

      <div class="ticket-body">
        <img id="ticketQR" />
        <div class="row">
          <span>Name</span>
          <strong id="tName"></strong>
        </div>

        <div class="row">
          <span>Mobile</span>
          <strong id="tMobile"></strong>
        </div>

        <div class="row">
          <span>Route</span>
          <strong id="tRoute"></strong>
        </div>

        <div class="row">
          <span>Seat No.</span>
          <strong id="tSeat"></strong>
        </div>

        <div class="row">
          <span>Fare</span>
          <strong id="tFare"></strong>
        </div>

        <div class="row">
          <span>Booking ID</span>
          <strong id="bookingId"></strong>
        </div>

        <div class="journey">🚌 Safe Journey with TRIPZO</div>
      </div>

      <div class="ticket-footer">Thank you for choosing TRIPZO</div>
    </div>

    <div class="btns">
      <button onclick="downloadTicket()">Download Ticket</button>
      <button onclick="shareTicket()">Share Ticket</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
